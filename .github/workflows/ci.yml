name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"  # the floor of required-version in pyproject.toml
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Lint
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .
      - name: Types
        run: uv run --locked mypy src tests scripts
      - name: Tests, with the coverage floor
        run: uv run --locked pytest --cov --cov-report=term-missing
