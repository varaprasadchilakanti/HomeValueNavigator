<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Estimate a Bengaluru home price from area, bedrooms, bathrooms and location.">
    <title>HomeValueNavigator: Bengaluru home price estimate</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
<main class="card">
    <h1>HomeValueNavigator</h1>
    <p class="lede">An estimate for a Bengaluru home, from a linear model trained on dated
        listings. A learning project, not a valuation.</p>
    <form id="form" novalidate>
        <label for="sqft">Area (square feet)</label>
        <input id="sqft" name="sqft" type="number" inputmode="numeric" min="300" max="30000"
               step="1" value="1000" required>

        <fieldset>
            <legend>Bedrooms (BHK)</legend>
            <div class="choices" id="bhk"></div>
        </fieldset>

        <fieldset>
            <legend>Bathrooms</legend>
            <div class="choices" id="bath"></div>
        </fieldset>

        <label for="location">Location</label>
        <select id="location" name="location" required>
            <option value="">Loading locations...</option>
        </select>

        <button type="submit">Estimate price</button>
    </form>
    <p id="result" class="result" role="status" aria-live="polite"></p>
    <p class="foot">The estimate is computed in your browser from the model's published
        weights; nothing you enter is sent anywhere.
        <a href="https://github.com/varaprasadchilakanti/HomeValueNavigator">Source</a></p>
</main>
<script src="app.js"></script>
</body>
</html>
